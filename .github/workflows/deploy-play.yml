name: Deploy ke Google Play

# Build AAB ter-signed + unggah otomatis ke Google Play Console.
#
# Hanya berjalan manual (tombol "Run workflow") agar rilis terkendali.
#
# PRASYARAT GitHub Secrets:
#   - ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#     ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   (untuk menandatangani AAB)
#   - GOOGLE_PLAY_SERVICE_ACCOUNT_JSON          (service account Play, isi JSON)
#     Service account butuh izin rilis di Play Console
#     (Users & permissions → Release → Release to production/testing).
#
# "Update wajib" (forced): isi field "priority" 4 atau 5. Nilai ini ditulis
# ke rilis lewat Play Developer API (TIDAK bisa diset dari UI Play Console).
# Aplikasi sudah punya logika (appUpdate.js): priority >= 4 → layar update
# penuh Google (immediate/forced); < 4 → unduh latar belakang (flexible).

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Jalur rilis Play'
        required: true
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]
      priority:
        description: 'Prioritas in-app update (0=biasa … 4-5=WAJIB/forced)'
        required: true
        default: '0'
        type: choice
        options: ['0', '1', '2', '3', '4', '5']
      status:
        description: 'Status rilis'
        required: true
        default: 'completed'
        type: choice
        options: [completed, draft, inProgress, halted]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web (Vite)
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diset."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/frontend/android/app/upload.keystore"

      - name: Build signed AAB
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/app/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Cek service account Play
        env:
          SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON belum diset. Tambahkan JSON service account Play."
            exit 1
          fi
          echo "Service account JSON length = ${#SA}"

      - name: Upload ke Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kasir.mnxcreations
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.status }}
          inAppUpdatePriority: ${{ github.event.inputs.priority }}

      - name: Remove keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/frontend/android/app/upload.keystore"
