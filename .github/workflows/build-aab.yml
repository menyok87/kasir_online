name: Build Android App Bundle (AAB)

# Build AAB ter-signed untuk diunggah ke Google Play Console.
# Wajib menambahkan 4 GitHub Secrets terlebih dulu (lihat README di bawah):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
  push:
    branches:
      - claude/build-online-cashier-p4jw2
    paths:
      - '.github/workflows/build-aab.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web (Vite)
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Cek secrets (aman — hanya panjang, bukan isi)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "ANDROID_KEYSTORE_BASE64   length = ${#KS}"
          echo "ANDROID_KEYSTORE_PASSWORD length = ${#PW}"
          echo "ANDROID_KEY_ALIAS         length = ${#AL}"
          echo "ANDROID_KEY_PASSWORD      length = ${#KP}"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diset. Tambahkan dulu di Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/frontend/android/app/upload.keystore"

      - name: Build signed AAB
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/app/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/frontend/android/app/upload.keystore"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: kasir-online-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

