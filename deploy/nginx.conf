# =============================================================
#  Kasir Online — Nginx Site Configuration
#  Domain   : kasir.keuangan99.com
#  Backend  : http://localhost:3002 (Express melayani semua request)
#  Simpan di: /etc/nginx/sites-available/kasir_online
#  Aktifkan : sudo ln -s /etc/nginx/sites-available/kasir_online /etc/nginx/sites-enabled/
#  Test     : sudo nginx -t
#  Reload   : sudo systemctl reload nginx
# =============================================================

server {
    listen 80;
    server_name kasir.keuangan99.com;
    root /var/www/kasir_online/frontend;

    # Redirect HTTP ke HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kasir.keuangan99.com;
    root /var/www/kasir_online/frontend;

    # SSL Certificate
    ssl_certificate     /etc/ssl/keuangan99.pem;
    ssl_certificate_key /etc/ssl/keuangan99key.pem;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                                                    always;
    add_header X-XSS-Protection       "1; mode=block"                                                 always;
    add_header X-Content-Type-Options  "nosniff"                                                      always;
    add_header Referrer-Policy         "no-referrer-when-downgrade"                                   always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/xml+rss application/javascript;

    # ── Semua request diteruskan ke Express (port 3002) ──
    location / {
        proxy_pass         http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       'upgrade';
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Favicon
    location = /favicon.ico {
        proxy_pass http://localhost:3002;
        expires 1y;
        add_header Cache-Control "public, immutable";
        log_not_found off;
        access_log    off;
    }

    # Robots.txt
    location = /robots.txt {
        proxy_pass    http://localhost:3002;
        log_not_found off;
        access_log    off;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3002;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        proxy_pass http://localhost:3002;
        access_log off;
    }

    # Blokir akses file tersembunyi (.env, .git, dll)
    location ~ /\. {
        deny all;
    }

    # Blokir file backup
    location ~ ~$ {
        deny all;
        access_log    off;
        log_not_found off;
    }

    # Log
    access_log /var/log/nginx/kasir_online_access.log;
    error_log  /var/log/nginx/kasir_online_error.log;
}
