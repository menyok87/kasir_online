# =============================================================
#  Kasir Online — Nginx Site Configuration
#  Simpan di: /etc/nginx/sites-available/kasir_online
#  Aktifkan : sudo ln -s /etc/nginx/sites-available/kasir_online /etc/nginx/sites-enabled/
#  Test     : sudo nginx -t
#  Reload   : sudo systemctl reload nginx
# =============================================================

server {
    listen 80;
    listen [::]:80;

    # Ganti dengan domain atau IP server Anda
    server_name your-domain.com www.your-domain.com;

    # ── Keamanan dasar ──
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;

    # ── Frontend: static files dari hasil build Vite ──
    root /var/www/kasir_online/frontend/dist;
    index index.html;

    # SPA fallback — semua route dikembalikan ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache asset statis (JS, CSS, gambar) selama 1 tahun
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Backend API: proxy ke Node.js di port 3002 ──
    location /api/ {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Log
    access_log /var/log/nginx/kasir_online_access.log;
    error_log  /var/log/nginx/kasir_online_error.log;
}

# =============================================================
#  HTTPS (aktifkan setelah install Certbot)
#  sudo certbot --nginx -d your-domain.com -d www.your-domain.com
# =============================================================
