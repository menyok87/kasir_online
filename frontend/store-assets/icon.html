<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
  .icon {
    width: 512px;
    height: 512px;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 50%, #4f46e5 100%);
    border-radius: 96px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .icon::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -60px;
    width: 260px;
    height: 260px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  .icon::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -40px;
    width: 220px;
    height: 220px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }
  svg.store-icon {
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.3));
    z-index: 1;
  }
  .app-name {
    color: white;
    font-family: 'Arial', sans-serif;
    font-weight: 800;
    font-size: 52px;
    letter-spacing: -1px;
    margin-top: 18px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    z-index: 1;
  }
  .tagline {
    color: rgba(255,255,255,0.7);
    font-family: 'Arial', sans-serif;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 4px;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="icon">
  <svg class="store-icon" width="180" height="180" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Store building -->
    <rect x="2" y="11" width="20" height="11" rx="1" fill="white" fill-opacity="0.95"/>
    <!-- Roof / awning -->
    <path d="M1 7h22l-1.5 4H2.5L1 7z" fill="white" fill-opacity="0.95"/>
    <!-- Door -->
    <rect x="9.5" y="14" width="5" height="8" rx="0.5" fill="#2563eb"/>
    <!-- Windows -->
    <rect x="3" y="13" width="4" height="3" rx="0.3" fill="#60a5fa"/>
    <rect x="17" y="13" width="4" height="3" rx="0.3" fill="#60a5fa"/>
    <!-- Sign board -->
    <rect x="4" y="3" width="16" height="4" rx="0.5" fill="white" fill-opacity="0.6"/>
    <!-- Cashier symbol on sign -->
    <rect x="6" y="4.5" width="3" height="1" rx="0.2" fill="white"/>
    <rect x="10.5" y="4.5" width="7" height="1" rx="0.2" fill="white"/>
  </svg>
  <div class="app-name">Kasir</div>
  <div class="tagline">Online POS</div>
</div>
</body>
</html>
